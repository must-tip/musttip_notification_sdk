openapi: 3.1.0
info:
  title: Must Tip External Notification API
  version: 1.0.0
  description: Versioned, application-scoped developer API over the existing Must Tip notification domain. Tenant and application
    ownership are derived from a verified OAuth principal and cannot be supplied by request data. This SDK copy enriches request
    schemas without changing service semantics.
servers:
- url: /api/v1/external/notifications
security:
- OAuth2: []
tags:
- name: Capabilities
- name: Notifications
- name: Delivery
- name: Attachments
- name: Push tokens
- name: Preferences
- name: Templates
- name: Bulk mutations
- name: Digests
- name: Realtime
- name: Usage
paths:
  /capabilities/:
    get:
      tags:
      - Capabilities
      operationId: getExternalNotificationCapabilities
      security:
      - OAuth2:
        - notifications.read
      responses:
        '200':
          $ref: '#/components/responses/StandardRead'
        '400': &id001
          $ref: '#/components/responses/Error'
        '401': &id002
          $ref: '#/components/responses/Error'
        '403': &id003
          $ref: '#/components/responses/Error'
        '404': &id004
          $ref: '#/components/responses/Error'
        '409': &id005
          $ref: '#/components/responses/Error'
        '412': &id006
