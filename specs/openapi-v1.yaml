      - Notifications
      operationId: listNotifications
      security:
      - OAuth2:
        - notifications.read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageSize'
      - name: recipient_identifier
        in: query
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: notification_type
        in: query
        schema:
          type: string
          maxLength: 64
      - name: category
        in: query
        schema:
          type: string
          maxLength: 64
      - name: delivery_status
        in: query
        schema:
          type: string
          maxLength: 32
      - name: unread
        in: query
        schema:
          type: boolean
      - name: search
        in: query
        schema:
          type: string
          maxLength: 200
      responses:
        '200':
          $ref: '#/components/responses/StandardRead'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '412': *id006
        '428': *id007
        '429': *id008
        '503': *id009
    post:
      tags:
      - Notifications
      operationId: createNotification
      security:
      - OAuth2:
        - notifications.send
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationCreate'
      responses:
        '200':
          $ref: '#/components/responses/AcceptedOrCreated'
        '201':
          $ref: '#/components/responses/AcceptedOrCreated'
        '202':
          $ref: '#/components/responses/AcceptedOrCreated'
        '204':
          description: Command completed without a response body
