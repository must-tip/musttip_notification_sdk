              maxLength: 64
    DigestBuild:
      type: object
      additionalProperties: false
      required:
      - command
      - frequency
      - period_start
      - period_end
      - scheduled_for
      properties:
        command:
          type: string
          const: build
        frequency:
          type: string
          enum:
          - hourly
          - daily
          - weekly
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        scheduled_for:
          type: string
          format: date-time
        channels:
          type: array
          uniqueItems: true
          maxItems: 7
          items: *id011
        recipient_identifier: *id016
    DigestCommand:
      type: object
      additionalProperties: false
      required:
      - command
      properties:
        command:
          type: string
          enum:
          - send
          - retry
          - cancel
        channels:
          type: array
          uniqueItems: true
          maxItems: 7
          items: *id011
    RealtimeTicketIssue:
      type: object
      additionalProperties: false
      required:
      - recipient_identifier
      - origin
      properties:
        recipient_identifier: *id016
