components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            notifications.send: Send notifications
            notifications.batch.send: Send bounded batches
            notifications.read: Read application notifications
            notifications.cancel: Cancel notifications
            notifications.retry: Retry notification delivery
            notifications.attempts.read: Read delivery attempts
            notifications.receipts.read: Read receipts
            notifications.events.write: Record client interactions
            notifications.attachments.write: Manage attachment references
            notifications.tokens.write: Manage push tokens
            notifications.preferences.read: Read preferences
            notifications.preferences.write: Manage preferences
            notifications.templates.read: Read templates
            notifications.templates.write: Manage templates
            notifications.digests.read: Read digests
            notifications.digests.write: Manage digests
            notifications.realtime: Manage realtime tickets
            notifications.usage.read: Read usage aggregates
            notifications.tenant.read: Read all applications in a tenant
            notifications.tenant.manage: Manage all applications in a tenant
  parameters:
    NotificationId:
      name: public_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecipientIdentifier:
      name: recipient_identifier
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 1024
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
  requestBodies:
    GenericObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    StandardRead:
      description: Scoped resource or collection response
      content:
        application/json:
          schema:
            type: object
    AcceptedOrCreated:
      description: Completed result or asynchronous accepted command
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/AcceptedCommand'
            - type: object
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 255
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,254}$
    Channel:
      type: string
      enum:
      - in_app
      - websocket
      - push
      - email
      - sms
      - voice
      - webhook
    NotificationCreate:
      type: object
      additionalProperties: false
      required:
      - recipient_identifier
      - notification_type
      properties:
        recipient_identifier:
          $ref: '#/components/schemas/Identifier'
        notification_type:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 250
        message:
          type: string
          maxLength: 250
        content:
          type: string
          maxLength: 65536
        channels:
          type: array
          uniqueItems: true
          maxItems: 7
          items:
            $ref: '#/components/schemas/Channel'
        template_key:
          type: string
          maxLength: 128
        template_version:
          type: integer
          minimum: 1
        locale:
          type: string
          maxLength: 35
        scheduled_for:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        metadata:
          type: object
        actions:
          type: array
          maxItems: 32
        idempotency_key:
          type: string
          maxLength: 128
    InteractionCreate:
      type: object
      additionalProperties: false
      required:
      - actor_identifier
      - interaction_type
      properties:
        actor_identifier:
          $ref: '#/components/schemas/Identifier'
        interaction_type:
          type: string
          enum:
          - open
          - read
          - dismiss
          - action
          - reply
          - snooze
          - pin
          - unpin
        action_id:
          type: string
          maxLength: 64
        reply_text:
          type: string
          maxLength: 4096
        payload:
          type: object
        client_event_id:
          type: string
          maxLength: 128
        occurred_at:
          type: string
          format: date-time
    AttachmentReference:
      type: object
      additionalProperties: false
      required:
      - media_id
      - size_bytes
      properties:
        media_id:
          $ref: '#/components/schemas/Identifier'
        file_name:
          type: string
          maxLength: 255
        content_type:
          type: string
          maxLength: 255
        size_bytes:
          type: integer
          minimum: 0
        checksum_sha256:
          type: string
          pattern: ^[A-Fa-f0-9]{64}$
        alt_text:
          type: string
          maxLength: 500
        metadata:
          type: object
    PushTokenRegistration:
      type: object
      additionalProperties: false
      required:
      - token
      - external_id
      properties:
        token:
          type: string
          writeOnly: true
          maxLength: 512
        external_id:
          $ref: '#/components/schemas/Identifier'
        installation_id:
          $ref: '#/components/schemas/Identifier'
        device_id:
          $ref: '#/components/schemas/Identifier'
        platform:
          type: string
        provider:
          type: string
        permission_status:
          type: string
        metadata:
          type: object
    AcceptedCommand:
      type: object
      required:
      - status
      properties:
        status:
          const: accepted
        task_id:
          type:
          - string
          - 'null'
    Error:
      type: object
      properties:
        detail: {}
    NotificationSettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        disable_all_notifications:
          type: boolean
        can_call:
          type: boolean
        order_status_updates:
          type: boolean
        promotional_offers:
          type: boolean
        transaction_alerts:
          type: boolean
        security_alerts:
          type: boolean
        likes_and_comments:
          type: boolean
        friend_requests:
          type: boolean
        reminders:
          type: boolean
        scheduled_events:
          type: boolean
        in_app_notifications:
          type: boolean
        websocket_notifications:
          type: boolean
        push_notifications:
          type: boolean
        email_notifications:
          type: boolean
        sms_notifications:
          type: boolean
        voice_notifications:
          type: boolean
        webhook_notifications:
          type: boolean
        banking_notifications:
          type: boolean
        blockchain_notifications:
          type: boolean
        fraud_and_risk_notifications:
          type: boolean
        compliance_notifications:
          type: boolean
        service_incident_notifications:
          type: boolean
        marketing_notifications:
          type: boolean
        social_notifications:
          type: boolean
        delivery_notifications:
          type: boolean
        sales_notifications:
          type: boolean
        todo_notifications:
          type: boolean
        transactional_notifications:
          type: boolean
        quiet_hours_enabled:
          type: boolean
        digest_enabled:
          type: boolean
        push_sound_enabled:
          type: boolean
        push_badge_enabled:
          type: boolean
        push_preview_enabled:
          type: boolean
        allow_deep_links:
          type: boolean
        expected_version:
          type: integer
          minimum: 1
        expected_etag:
          type: string
          maxLength: 128
        quiet_hours_start:
          type:
          - string
          - 'null'
          format: time
        quiet_hours_end:
          type:
          - string
          - 'null'
          format: time
        quiet_hours_days:
          type: array
          uniqueItems: true
          maxItems: 7
          items:
            type: integer
            minimum: 0
            maximum: 6
        timezone:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 35
        digest_frequency:
          type: string
          enum:
          - immediate
          - hourly
          - daily
          - weekly
        digest_time:
          type:
          - string
          - 'null'
          format: time
        minimum_priority:
          type: string
          maxLength: 16
        channel_preferences: &id010
          type: object
          maxProperties: 256
          additionalProperties: true
        category_preferences: *id010
        channel_fallback_order:
          type: array
          uniqueItems: true
          maxItems: 7
          items: &id011
            $ref: '#/components/schemas/Channel'
        max_notifications_per_hour:
          type: integer
          minimum: 0
          maximum: 100000
        max_notifications_per_day:
          type: integer
          minimum: 0
          maximum: 1000000
    PreferenceScopeWrite:
      type: object
      additionalProperties: false
      properties:
        scope_application_id: &id016
          $ref: '#/components/schemas/Identifier'
        disable_all_notifications:
          type:
          - boolean
          - 'null'
        minimum_priority:
          type: string
          maxLength: 16
        channel_preferences: *id010
        category_preferences: *id010
        quiet_hours_enabled:
          type:
          - boolean
          - 'null'
        quiet_hours_start:
          type:
          - string
          - 'null'
          format: time
        quiet_hours_end:
          type:
          - string
          - 'null'
          format: time
        quiet_hours_days:
          type: array
          uniqueItems: true
          maxItems: 7
          items:
            type: integer
            minimum: 0
            maximum: 6
        muted_until:
          type:
          - string
          - 'null'
          format: date-time
        expected_version:
          type: integer
          minimum: 1
    TemplateCreate:
      type: object
      additionalProperties: false
      required:
      - template_key
      - body_template
      - channel
      properties: &id012
        template_key: &id013
          type: string
          minLength: 1
          maxLength: 128
        version: &id014
          type: integer
          minimum: 1
        locale: &id015
          type: string
          maxLength: 35
        channel: *id011
        title_template:
          type: string
          maxLength: 500
        body_template:
          type: string
          maxLength: 65536
        content_template:
          type: string
          maxLength: 65536
        icon:
          type: string
          maxLength: 128
        actions:
          type: array
          maxItems: 32
          items:
            type: object
        metadata_defaults: *id010
        is_active:
          type: boolean
    TemplateUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties: *id012
    TemplatePreview:
      type: object
      additionalProperties: false
      required:
      - template_key
      - channel
      - context
      properties:
        template_key: *id013
        version: *id014
        locale: *id015
        channel: *id011
        context: *id010
    BulkMutationCreate:
      type: object
      additionalProperties: false
      required:
      - operation
      properties:
        operation:
          type: string
          enum:
          - mark_all_read
          - archive_all
          - delete_all
        filters:
