          type: string
          format: uri
          maxLength: 500
        last_sequence:
          type: integer
          minimum: 0
          default: 0
        ttl_seconds:
          type: integer
          minimum: 30
          maximum: 3600
    RealtimeTicketConsume:
      type: object
      additionalProperties: false
      required:
      - token
      - origin
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 20
          maxLength: 1024
        origin:
          type: string
          format: uri
          maxLength: 500
