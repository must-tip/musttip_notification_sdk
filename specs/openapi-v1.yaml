components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            notifications.send: Send notifications
            notifications.batch.send: Send bounded batches
            notifications.read: Read application notifications
            notifications.cancel: Cancel notifications
            notifications.delete: Delete owned notifications
            notifications.retry: Retry notification delivery
            notifications.attempts.read: Read delivery attempts
            notifications.receipts.read: Read receipts
            notifications.events.write: Record client interactions
            notifications.attachments.write: Manage attachment references
            notifications.tokens.write: Manage push tokens
            notifications.preferences.read: Read preferences
            notifications.preferences.write: Manage preferences
            notifications.templates.read: Read templates
            notifications.templates.write: Manage templates
            notifications.digests.read: Read digests
            notifications.digests.write: Manage digests
            notifications.realtime: Manage realtime tickets
            notifications.usage.read: Read usage aggregates
            notifications.tenant.read: Read all applications in a tenant
            notifications.tenant.manage: Manage all applications in a tenant
  parameters:
    NotificationId:
      name: public_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecipientIdentifier:
      name: recipient_identifier
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 1024
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
  requestBodies:
    GenericObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    StandardRead:
      description: Scoped resource or collection response
      content:
        application/json:
          schema:
            type: object
    AcceptedOrCreated:
      description: Completed result or asynchronous accepted command
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/AcceptedCommand'
            - type: object
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 255
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,254}$
    Channel:
      type: string
      enum:
      - in_app
      - websocket
      - push
      - email
      - sms
      - voice
      - webhook
    NotificationCreate:
      type: object
      additionalProperties: false
      required:
      - recipient_identifier
      - notification_type
      properties:
        recipient_identifier:
          $ref: '#/components/schemas/Identifier'
        notification_type:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 250
        message:
          type: string
          maxLength: 250
        content:
          type: string
          maxLength: 65536
        channels:
          type: array
          uniqueItems: true
          maxItems: 7
          items:
            $ref: '#/components/schemas/Channel'
        template_key:
          type: string
          maxLength: 128
        template_version:
          type: integer
          minimum: 1
        locale:
          type: string
          maxLength: 35
        scheduled_for:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        metadata:
          type: object
        actions:
          type: array
          maxItems: 32
        idempotency_key:
          type: string
          maxLength: 128
    InteractionCreate:
      type: object
      additionalProperties: false
      required:
      - actor_identifier
      - interaction_type
      properties:
        actor_identifier:
          $ref: '#/components/schemas/Identifier'
        interaction_type:
          type: string
          enum:
          - open
          - read
          - dismiss
          - action
          - reply
          - snooze
          - pin
          - unpin
        action_id:
          type: string
          maxLength: 64
        reply_text:
          type: string
          maxLength: 4096
        payload:
          type: object
        client_event_id:
          type: string
          maxLength: 128
        occurred_at:
          type: string
          format: date-time
    AttachmentReference:
      type: object
      additionalProperties: false
      required:
      - media_id
      - size_bytes
      properties:
        media_id:
          $ref: '#/components/schemas/Identifier'
        file_name:
          type: string
          maxLength: 255
        content_type:
          type: string
          maxLength: 255
        size_bytes:
          type: integer
          minimum: 0
        checksum_sha256:
          type: string
          pattern: ^[A-Fa-f0-9]{64}$
        alt_text:
          type: string
          maxLength: 500
        metadata:
          type: object
    PushTokenRegistration:
      type: object
      additionalProperties: false
      required:
      - token
      - external_id
      properties:
        token:
          type: string
          writeOnly: true
          maxLength: 512
        external_id:
          $ref: '#/components/schemas/Identifier'
        installation_id:
          $ref: '#/components/schemas/Identifier'
        device_id:
          $ref: '#/components/schemas/Identifier'
        platform:
          type: string
        provider:
          type: string
        permission_status:
          type: string
        metadata:
          type: object
    AcceptedCommand:
      type: object
      required:
      - status
      properties:
        status:
          const: accepted
        task_id:
          type:
          - string
          - 'null'
    Error:
      type: object
      properties:
        detail: {}
