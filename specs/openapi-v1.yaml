openapi: 3.1.0
info:
  title: Must Tip External Notification API
  version: 1.0.0
  description: Versioned, application-scoped developer API over the existing Must Tip notification domain. Tenant
    and application ownership are derived from a verified OAuth principal and cannot be supplied by request data.
servers:
- url: /api/v1/external/notifications
security:
- OAuth2: []
tags:
- name: Capabilities
- name: Notifications
- name: Delivery
- name: Attachments
- name: Push tokens
- name: Preferences
- name: Templates
- name: Bulk mutations
- name: Digests
- name: Realtime
- name: Usage
paths:
  /capabilities/:
    get:
      tags:
      - Capabilities
      operationId: getExternalNotificationCapabilities
      security:
      - OAuth2:
        - notifications.read
      responses:
        '200':
          $ref: '#/components/responses/StandardRead'
        '400': &id001
          $ref: '#/components/responses/Error'
        '401': &id002
          $ref: '#/components/responses/Error'
        '403': &id003
          $ref: '#/components/responses/Error'
        '404': &id004
          $ref: '#/components/responses/Error'
        '409': &id005
          $ref: '#/components/responses/Error'
        '412': &id006
          $ref: '#/components/responses/Error'
        '428': &id007
          $ref: '#/components/responses/Error'
        '429': &id008
          $ref: '#/components/responses/Error'
        '503': &id009
          $ref: '#/components/responses/Error'
  /notifications/:
    get:
      tags:
      - Notifications
      operationId: listNotifications
      security:
      - OAuth2:
        - notifications.read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageSize'
      - name: recipient_identifier
        in: query
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: notification_type
        in: query
        schema:
          type: string
          maxLength: 64
      - name: category
        in: query
        schema:
          type: string
          maxLength: 64
      - name: delivery_status
        in: query
        schema:
          type: string
          maxLength: 32
      - name: unread
        in: query
        schema:
          type: boolean
      - name: search
        in: query
        schema:
          type: string
          maxLength: 200
      responses:
        '200':
          $ref: '#/components/responses/StandardRead'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '412': *id006
        '428': *id007
        '429': *id008
        '503': *id009
    post:
      tags:
      - Notifications
      operationId: createNotification
      security:
      - OAuth2:
        - notifications.send
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationCreate'
      responses:
        '200':
          $ref: '#/components/responses/AcceptedOrCreated'
        '201':
          $ref: '#/components/responses/AcceptedOrCreated'
        '202':
          $ref: '#/components/responses/AcceptedOrCreated'
        '204':
          description: Command completed without a response body
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '412': *id006
        '428': *id007
        '429': *id008
        '503': *id009
  /applications/{application_id}/notifications/:
    parameters:
    - name: application_id
